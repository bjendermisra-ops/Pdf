    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Firebase Configuration & Initialization
        const firebaseConfig = { 
            apiKey: "AIzaSyCNUsa84ocl5z47r3HTg-tQpAqqhYQ-UAQ", 
            authDomain: "iskcon-slider.firebaseapp.com", 
            databaseURL: "https://iskcon-slider-default-rtdb.firebaseio.com",

            storageBucket: "iskcon-slider.firebasestorage.app",

        };
        
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const database = firebase.database();

        /* ===================================================
           FONTS & IN-LINE CSS GLOBAL INJECTOR
           =================================================== */
        const injectStyles = () => {
            if (!document.getElementById('santosh-global-styles')) {
                const link = document.createElement('link');
                link.rel = 'stylesheet';
                link.href = 'https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;700;800;900&display=swap';
                document.head.appendChild(link);

                const style = document.createElement('style');
                style.id = 'santosh-global-styles';
                style.innerHTML = `
                    html, body, #root {
                        background-color: #0C0C0C;
                        font-family: 'Kanit', sans-serif;
                        margin: 0;
                        padding: 0;
                        box-sizing: border-box;
                        overflow-x: hidden;
                        scroll-behavior: smooth;
                    }
                    .hero-heading {
                        background: linear-gradient(180deg, #646973 0%, #BBCCD7 100%);
                        -webkit-background-clip: text;
                        -webkit-text-fill-color: transparent;
                    }
                    /* Custom Scrollbar */
                    ::-webkit-scrollbar { width: 6px; }
                    ::-webkit-scrollbar-track { background: #0C0C0C; }
                    ::-webkit-scrollbar-thumb {
                        background: linear-gradient(to bottom, #646973, #BBCCD7);
                        border-radius: 10px;
                    }
                    /* Background Orbs animation */
                    .bg-orb {
                        position: absolute;
                        border-radius: 50%;
                        filter: blur(120px);
                        pointer-events: none;
                        opacity: 0.15;
                        animation: floatOrb 12s infinite alternate ease-in-out;
                    }
                    @keyframes floatOrb {
                        0% { transform: translate(0, 0) scale(1); }
                        100% { transform: translate(40px, 30px) scale(1.1); }
                    }
                    
                    /* 🚀 100% SMOOTH HARDWARE-ACCELERATED CSS MARQUEE ANIMATION 🚀 */
                    @keyframes marqueeRight {
                        0% { transform: translate3d(0, 0, 0); }
                        100% { transform: translate3d(-33.3333%, 0, 0); }
                    }
                    @keyframes marqueeLeft {
                        0% { transform: translate3d(-33.3333%, 0, 0); }
                        100% { transform: translate3d(0, 0, 0); }
                    }
                    .animate-marquee-right {
                        display: flex;
                        width: max-content;
                        animation: marqueeRight 32s linear infinite;
                        will-change: transform;
                    }
                    .animate-marquee-left {
                        display: flex;
                        width: max-content;
                        animation: marqueeLeft 32s linear infinite;
                        will-change: transform;
                    }
                    
                    /* Cursor settings */
                    @media (min-width: 769px) {
                        * { cursor: none !important; }
                    }
                `;
                document.head.appendChild(style);
            }
        };

        /* ===================================================
           REUSABLE ANIMATION & INTERACTIVE COMPONENTS
           =================================================== */

        // Custom Fade-In Component with clean GPU transition
        const FadeIn = ({ children, delay = 0, duration = 0.7, x = 0, y = 30, className = "" }) => {
            const [isVisible, setIsVisible] = useState(false);
            const ref = useRef(null);

            useEffect(() => {
                const observer = new IntersectionObserver(([entry]) => {
                    if (entry.isIntersecting) {
                        setIsVisible(true);
                    }
                }, { threshold: 0.05 });
                if (ref.current) observer.observe(ref.current);
                return () => observer.disconnect();
            }, []);

            return (
                <div
                    ref={ref}
                    className={className}
                    style={{
                        opacity: isVisible ? 1 : 0,
                        transform: isVisible 
                            ? 'translate3d(0px, 0px, 0px)' 
                            : `translate3d(${x}px, ${y}px, 0px)`,
                        transition: `opacity ${duration}s cubic-bezier(0.25, 0.1, 0.25, 1) ${delay}s, transform ${duration}s cubic-bezier(0.25, 0.1, 0.25, 1) ${delay}s`,
                        willChange: 'opacity, transform'
                    }}
                >
                    {children}
                </div>
            );
        };

        // Magnetic Hover Effect (RequestAnimationFrame Optimized)
        const Magnet = ({ children, padding = 150, strength = 3, className = "" }) => {
            const [coords, setCoords] = useState({ x: 0, y: 0 });
            const [isHovered, setIsHovered] = useState(false);
            const ref = useRef(null);

            useEffect(() => {
                if (window.innerWidth <= 768) return;

                let ticking = false;

                const handleMouseMove = (e) => {
                    if (!ref.current) return;
                    if (!ticking) {
                        window.requestAnimationFrame(() => {
                            const rect = ref.current.getBoundingClientRect();
                            const center = {
                                x: rect.left + rect.width / 2,
                                y: rect.top + rect.height / 2
                            };
                            const distance = Math.hypot(e.clientX - center.x, e.clientY - center.y);

                            if (distance < padding) {
                                setIsHovered(true);
                                setCoords({
                                    x: (e.clientX - center.x) / strength,
                                    y: (e.clientY - center.y) / strength
                                });
                            } else {
                                setIsHovered(false);
                                setCoords({ x: 0, y: 0 });
                            }
                            ticking = false;
                        });
                        ticking = true;
                    }
                };

                window.addEventListener('mousemove', handleMouseMove);
                return () => window.removeEventListener('mousemove', handleMouseMove);
            }, [padding, strength]);

            return (
                <div
                    ref={ref}
                    className={className}
                    style={{
                        transform: `translate3d(${coords.x}px, ${coords.y}px, 0px)`,
                        transition: isHovered ? 'transform 0.1s ease-out' : 'transform 0.4s ease-in-out',
                        willChange: 'transform'
                    }}
                >
                    {children}
                </div>
            );
        };

        // Smooth Scroll Character Reveal (Native GPU Optimized)
        const AnimatedText = ({ text, className = "" }) => {
            const ref = useRef(null);
            const [scrollProgress, setScrollProgress] = useState(0);

            useEffect(() => {
                let ticking = false;
                const handleScroll = () => {
                    if (!ref.current) return;
                    if (!ticking) {
                        window.requestAnimationFrame(() => {
                            const rect = ref.current.getBoundingClientRect();
                            const windowHeight = window.innerHeight;
                            const startPoint = windowHeight * 0.85;
                            const endPoint = windowHeight * 0.15;
                            const currentPos = rect.top;

                            const progress = 1 - Math.max(0, Math.min(1, (currentPos - endPoint) / (startPoint - endPoint)));
                            setScrollProgress(progress);
                            ticking = false;
                        });
                        ticking = true;
                    }
                };
                window.addEventListener('scroll', handleScroll, { passive: true });
                handleScroll();
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            const chars = text.split("");

            return (
                <p ref={ref} className={`${className} inline-flex flex-wrap justify-center`}>
                    {chars.map((char, index) => {
                        const charThreshold = index / chars.length;
                        const charOpacity = scrollProgress >= charThreshold ? 1 : 0.2;
                        return (
                            <span 
                                key={index} 
                                style={{ opacity: charOpacity, transition: 'opacity 0.1s ease-out' }}
                                className="whitespace-pre transition-opacity duration-75"
                            >
                                {char}
                            </span>
                        );
                    })}
                </p>
            );
        };

        // Optimized Custom Cursor Tracker (RequestAnimationFrame throttled)
        const CustomCursor = () => {
            const [pos, setPos] = useState({ x: 0, y: 0 });
            const [followerPos, setFollowerPos] = useState({ x: 0, y: 0 });
            const [isHovered, setIsHovered] = useState(false);
            const [isMobile, setIsMobile] = useState(true);

            useEffect(() => {
                const checkScreen = () => {
                    setIsMobile(window.innerWidth <= 768);
                };
                checkScreen();
                window.addEventListener('resize', checkScreen);

                if (window.innerWidth > 768) {
                    let ticking = false;

                    const handleMouseMove = (e) => {
                        if (!ticking) {
                            window.requestAnimationFrame(() => {
                                setPos({ x: e.clientX, y: e.clientY });
                                setTimeout(() => {
                                    setFollowerPos({ x: e.clientX, y: e.clientY });
                                }, 40);
                                ticking = false;
                            });
                            ticking = true;
                        }
                    };

                    const handleMouseOver = (e) => {
                        const target = e.target.closest('button, a, input, select, textarea, .hover-target');
                        setIsHovered(!!target);
                    };

                    window.addEventListener('mousemove', handleMouseMove);
                    window.addEventListener('mouseover', handleMouseOver);

                    return () => {
                        window.removeEventListener('resize', checkScreen);
                        window.removeEventListener('mousemove', handleMouseMove);
                        window.removeEventListener('mouseover', handleMouseOver);
                    };
                }
            }, []);

            if (isMobile) return null;

            return (
                <React.Fragment>
                    <div 
                        className="fixed w-2 h-2 bg-[#BBCCD7] rounded-full pointer-events-none z-[999999] -translate-x-1/2 -translate-y-1/2"
                        style={{ left: `${pos.x}px`, top: `${pos.y}px`, mixBlendMode: 'difference' }}
                    />
                    <div 
                        className={`fixed rounded-full pointer-events-none z-[999998] -translate-x-1/2 -translate-y-1/2 transition-all duration-75 border border-[#BBCCD7]/60 ${isHovered ? 'w-14 h-14 bg-[#BBCCD7]/10 border-[#BBCCD7]' : 'w-10 h-10'}`}
                        style={{ left: `${followerPos.x}px`, top: `${followerPos.y}px`, mixBlendMode: 'difference' }}
                    />
                </React.Fragment>
            );
        };

        /* ===================================================
           REUSABLE BUTTON COMPONENT SETUP
           =================================================== */
        const ContactButton = ({ onClick }) => {
            return (
                <button
                    onClick={onClick}
                    className="relative rounded-full px-8 py-3 sm:px-10 sm:py-3.5 md:px-12 md:py-4 
                            text-xs sm:text-sm md:text-base font-medium uppercase tracking-widest text-white 
                            shadow-[0px_4px_4px_rgba(181,1,167,0.25),_inset_4px_4px_12px_#7721B1] 
                            outline outline-2 outline-white -outline-offset-4 cursor-pointer overflow-hidden transition-all duration-300 hover:scale-105 hover-target"
                    style={{
                        background: 'linear-gradient(123deg, #18011F 7%, #B600A8 37%, #7621B0 72%, #BE4C00 100%)',
                    }}
                >
                    <span className="relative z-10 flex items-center gap-2 justify-center">
                        Contact Me 
                        <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path>
                        </svg>
                    </span>
                </button>
            );
        };

        const LiveProjectButton = ({ href }) => {
            return (
                <a
                    href={href}
                    target="_blank"
                    rel="noopener noreferrer"
                    className="rounded-full border-2 border-[#D7E2EA] text-[#D7E2EA] font-medium uppercase tracking-widest 
                            px-6 py-2 sm:px-10 sm:py-3.5 text-xs sm:text-base inline-flex items-center gap-2 
                            hover:bg-[#D7E2EA]/10 transition-colors duration-200 cursor-pointer hover-target"
                >
                    Live Project
                    <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path>
                    </svg>
                </a>
            );
        };

        /* ===================================================
           DYNAMIC STATS COUNTER COMPONENT
           =================================================== */
        const StatsSection = () => {
            const [experience, setExperience] = useState(0);
            const [projects, setProjects] = useState(0);
            const [clients, setClients] = useState(0);
            const [satisfaction, setSatisfaction] = useState(0);
            const sectionRef = useRef(null);
            const [hasTriggered, setHasTriggered] = useState(false);

            useEffect(() => {
                const observer = new IntersectionObserver(([entry]) => {
                    if (entry.isIntersecting && !hasTriggered) {
                        setHasTriggered(true);
                        
                        const animateCount = (target, setter, duration = 1200) => {
                            let start = 0;
                            const increment = target / (duration / 16);
                            const timer = setInterval(() => {
                                start += increment;
                                if (start >= target) {
                                    setter(target);
                                    clearInterval(timer);
                                } else {
                                    setter(Math.ceil(start));
                                }
                            }, 16);
                        };

                        animateCount(5, setExperience);
                        animateCount(50, setProjects);
                        animateCount(30, setClients);
                        animateCount(100, setSatisfaction);
                    }
                }, { threshold: 0.1 });

                if (sectionRef.current) observer.observe(sectionRef.current);
                return () => observer.disconnect();
            }, [hasTriggered]);

            return (
                <section ref={sectionRef} className="py-16 bg-gradient-to-r from-transparent via-[#14141E]/50 to-transparent border-y border-white/5 z-20 relative select-none">
                    <div className="max-w-6xl mx-auto px-6 grid grid-cols-2 md:grid-cols-4 gap-8 text-center">
                        <div className="flex flex-col">
                            <span className="text-3xl sm:text-5xl font-black text-[#BBCCD7]">{experience}+</span>
                            <span className="text-[10px] uppercase tracking-widest text-[#646973] mt-2 font-black">Years Experience</span>
                        </div>
                        <div className="flex flex-col">
                            <span className="text-3xl sm:text-5xl font-black text-[#BBCCD7]">{projects}+</span>
                            <span className="text-[10px] uppercase tracking-widest text-[#646973] mt-2 font-black">Projects Completed</span>
                        </div>
                        <div className="flex flex-col">
                            <span className="text-3xl sm:text-5xl font-black text-[#BBCCD7]">{clients}+</span>
                            <span className="text-[10px] uppercase tracking-widest text-[#646973] mt-2 font-black">Happy Clients</span>
                        </div>
                        <div className="flex flex-col">
                            <span className="text-3xl sm:text-5xl font-black text-[#BBCCD7]">{satisfaction}%</span>
                            <span className="text-[10px] uppercase tracking-widest text-[#646973] mt-2 font-black">Satisfaction</span>
                        </div>
                    </div>
                </section>
            );
        };

        /* ===================================================
           DYNAMIC PROJECTS STACKING CARDS (GPU OPTIMIZED)
           =================================================== */
        const ProjectCard = ({ project, index, total }) => {
            const cardRef = useRef(null);
            const [scale, setScale] = useState(1);

            useEffect(() => {
                let ticking = false;
                const handleScroll = () => {
                    if (!cardRef.current) return;
                    if (!ticking) {
                        window.requestAnimationFrame(() => {
                            const rect = cardRef.current.getBoundingClientRect();
                            const cardTop = rect.top;
                            const stickyOffset = window.innerWidth >= 768 ? 128 : 96;

                            if (cardTop <= stickyOffset) {
                                const pastSticky = stickyOffset - cardTop;
                                const shrinkFactor = Math.min(1, pastSticky / 600); 
                                const maxShrink = (total - 1 - index) * 0.035;
                                setScale(1 - shrinkFactor * maxShrink);
                            } else {
                                setScale(1);
                            }
                            ticking = false;
                        });
                        ticking = true;
                    }
                };
                window.addEventListener('scroll', handleScroll, { passive: true });
                handleScroll();
                return () => window.removeEventListener('scroll', handleScroll);
            }, [index, total]);

            return (
                <div className="sticky top-24 md:top-32 w-full h-[75vh] sm:h-[80vh] md:h-[85vh] flex justify-center items-center z-10 mb-12">
                    <div
                        ref={cardRef}
                        style={{ 
                            transform: `scale(${scale}) translateZ(0)`,
                            top: `${index * 20}px`,
                            transition: 'transform 0.08s ease-out',
                            willChange: 'transform'
                        }}
                        className="w-full h-full rounded-[30px] sm:rounded-[50px] md:rounded-[60px] border-2 border-[#D7E2EA] 
                                bg-[#0C0C0C] p-4 sm:p-8 md:p-10 flex flex-col justify-between shadow-2xl relative overflow-hidden"
                    >
                        {/* Top Detail Row */}
                        <div className="flex justify-between items-center gap-4 border-b border-[#D7E2EA]/10 pb-4">
                            <div className="flex items-center gap-3 sm:gap-4">
                                <span className="font-black text-3xl sm:text-5xl md:text-6xl text-[#D7E2EA]">
                                    {project.num}
                                </span>
                                <div className="flex flex-col">
                                    <span className="text-[9px] uppercase tracking-widest text-zinc-500 font-bold">
                                        {project.category}
                                    </span>
                                    <h3 className="text-sm sm:text-xl md:text-3xl font-bold uppercase text-[#D7E2EA] truncate max-w-[150px] sm:max-w-none">
                                        {project.title}
                                    </h3>
                                </div>
                            </div>
                            
                            <LiveProjectButton href={project.liveLink || "#"} />
                        </div>

                        {/* Two Column Layout Block */}
                        <div className="grid grid-cols-1 md:grid-cols-[40%_60%] gap-3 sm:gap-6 mt-4 flex-grow overflow-hidden h-[60%] sm:h-[65%]">
                            
                            {/* Left Col: Stacked */}
                            <div className="flex flex-col justify-between gap-3 h-full">
                                <div className="w-full rounded-[20px] sm:rounded-[32px] md:rounded-[40px] overflow-hidden bg-zinc-900 border border-white/5 flex-1 relative min-h-[100px]">
                                    <img 
                                        src={project.img1} 
                                        alt={`${project.title} detail layout`} 
                                        className="absolute inset-0 w-full h-full object-cover brightness-95"
                                        loading="lazy"
                                    />
                                </div>
                                <div className="w-full rounded-[20px] sm:rounded-[32px] md:rounded-[40px] overflow-hidden bg-zinc-900 border border-white/5 flex-[1.2] relative min-h-[120px]">
                                    <img 
                                        src={project.img2} 
                                        alt={`${project.title} detailed asset`} 
                                        className="absolute inset-0 w-full h-full object-cover brightness-95"
                                        loading="lazy"
                                    />
                                </div>
                            </div>

                            {/* Right Col: Large image */}
                            <div className="w-full h-full rounded-[20px] sm:rounded-[32px] md:rounded-[40px] overflow-hidden bg-zinc-900 border border-white/5 relative min-h-[180px]">
                                <img 
                                    src={project.imgLarge} 
                                    alt={`${project.title} main visual`} 
                                    className="absolute inset-0 w-full h-full object-cover brightness-95 hover:scale-105 transition-transform duration-700 ease-out"
                                    loading="lazy"
                                />
                            </div>

                        </div>
                    </div>
                </div>
            );
        };

        const ProjectsSection = ({ fallbackProjects }) => {
            const [projects, setProjects] = useState([]);

            useEffect(() => {
                const projectsRef = database.ref('projects');
                const listener = projectsRef.on('value', (snap) => {
                    const data = snap.val();
                    if (data) {
                        const loaded = Object.keys(data).map((key, idx) => {
                            const item = data[key];
                            return {
                                num: item.num || `0${idx + 1}`,
                                title: item.title,
                                category: item.category || 'Client Output',
                                img1: item.img1 || item.img || (item.images && item.images[0]) || fallbackProjects[idx % 3].img1,
                                img2: item.img2 || (item.images && item.images[1]) || fallbackProjects[idx % 3].img2,
                                imgLarge: item.imgLarge || item.img || (item.images && item.images[2]) || fallbackProjects[idx % 3].imgLarge,
                                liveLink: item.link || item.liveLink || "#"
                            };
                        });
                        setProjects(loaded);
                    } else {
                        setProjects(fallbackProjects);
                    }
                }, () => {
                    setProjects(fallbackProjects);
                });

                return () => projectsRef.off('value', listener);
            }, [fallbackProjects]);

            return (
                <section id="projects" className="relative bg-[#0C0C0C] rounded-t-[40px] sm:rounded-t-[50px] md:rounded-t-[60px] -mt-10 sm:-mt-12 md:-mt-14 px-5 sm:px-8 md:px-10 pb-20 pt-24 z-10">
                    <div className="max-w-5xl mx-auto">
                        <div className="flex justify-center items-center mb-16 sm:mb-20 md:mb-28">
                            <FadeIn delay={0} y={40}>
                                <h2 className="hero-heading font-black uppercase text-center text-5xl sm:text-7xl md:text-8xl lg:text-9xl">
                                    Project
                                </h2>
                            </FadeIn>

                        <div className="w-full relative flex flex-col">

                            price: parseInt(data[key].price) || 0,
